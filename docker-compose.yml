services:
  pichaus:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
      - machine-learning
    volumes:
      - pichaus-storage:/app/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pichaus
      POSTGRES_PASSWORD: pichaus
      POSTGRES_DB: pichaus
    volumes:
      - pichaus-db:/var/lib/postgresql/data

  # Face detection is optional. This service can be removed when
  # FACE_DETECTION_ENABLED=false in .env.
  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    environment:
      MACHINE_LEARNING_CACHE_FOLDER: /cache
    volumes:
      - pichaus-ml-cache:/cache

volumes:
  pichaus-storage:
  pichaus-db:
  pichaus-ml-cache:
